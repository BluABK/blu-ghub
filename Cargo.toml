[package]
name = "blu-ghub"
version = "0.1.0"
edition = "2024"
description = "Lightweight replacement for Logitech G HUB: battery, lighting and G-keys for a G915 and a G935"
build = "build.rs"

# The package stays lowercase (idiomatic for a crate); the *binaries* carry the
# product name. The diagnostics are a separate console program rather than a
# `--diag` switch on the tray app: a windows-subsystem exe has no console of its
# own, and attaching to the parent's leaves the shell prompt interleaved with
# the output. Keeping them apart also guarantees the key logger never shares a
# process (and so a raw-input registration) with the settings window.
[[bin]]
name = "BluGHub"
path = "src/main.rs"

[[bin]]
name = "BluGHub-diag"
path = "src/bin/diag.rs"

# The icon and the application manifest are compiled into the exe. A missing
# resource compiler costs the icon, not the build (see build.rs).
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
# Per-monitor DPI awareness (crisp tray icon and menus), modern common
# controls, UTF-8 and long paths.
embed-manifest = "1.4"

[dependencies]
anyhow = "1.0"
# Local wall-clock time for log lines and file names. Just the clock: the
# timezone database and serde support are not needed.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
directories = "6.0"
# Writes the HKCU Run entry for "Start with Windows", as TunMan does.
auto-launch = "0.6"
serde = { version = "1.0", features = ["derive"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
# The settings window, opened on demand and dropped when closed (the tray
# itself is plain Win32). wgpu on Direct3D 12 rather than glow, as in TunMan:
# NVIDIA's OpenGL/Vulkan user-mode driver leaks into its own pools for any
# app that draws through it, which for a program that runs for weeks adds up.
eframe = { version = "0.36.1", default-features = false, features = ["wgpu", "default_fonts"] }
egui = "0.36.1"
# Importing per-key lighting from G HUB, whose settings are one JSON document
# in an SQLite database. Bundled SQLite: Windows ships no sqlite3.dll to link.
rusqlite = { version = "0.40", features = ["bundled"] }
serde_json = "1.0"

# HID access goes straight through Windows (HidD_*/HidP_*, overlapped
# ReadFile/WriteFile) rather than the hidapi crate: hidapi pads every write to
# the collection's report length, which turns a 7-byte HID++ short report sent
# to the wrong collection into a malformed 20-byte one instead of an error, and
# it silently falls back to a no-access handle when a read/write open fails.
# Both would hide exactly the mistakes this program must not make.
[target.'cfg(windows)'.dependencies]
# For the `interface` macro (the audio policy service's undocumented COM
# interface, see src/audio_fx.rs); the same crate `windows` already uses.
windows-core = "0.62"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_HumanInterfaceDevice",
    "Win32_Devices_Properties",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Performance",
    "Win32_System_SystemInformation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Power",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Input",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

# Optimise dependencies even in dev; keep our own crate at 1 so backtraces stay
# readable. (Same profiles as TunMan and StreamArchiver.)
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
strip = true
panic = "abort"
